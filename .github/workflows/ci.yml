name: CI
on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      attest-package:
        description: "Create GitHub provenance attestation for the package."
        default: "false"
        type: string
    outputs:
      artifact-basename:
        description: "Base name of the uploaded artifacts; use for artifact retrieval."
        value: ${{ jobs.package.outputs.artifact-basename }}

env:
  min_python_version: "3.10"
  FORCE_COLOR: "1"

defaults:
  run:
    shell: bash

# Cancel active CI runs for a PR before starting another run
concurrency:
  group: ${{ github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit checks
    uses: beeware/.github/.github/workflows/pre-commit-run.yml@84508d17a1d29ee3b82ce2e467dcd38c4a0c6a5a  # main
    with:
      pre-commit-source: "--group pre-commit"

  package:
    name: Package WebView2 (${{ matrix.arch }})
    needs: pre-commit
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    strategy:
      matrix:
        include:
          - arch: "x86"
            plat-name: "win32"
          - arch: "x86_64"
            plat-name: "win_amd64"
          - arch: "arm64"
            plat-name: "win_arm64"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ github.repository }}
          fetch-depth: 0  # Fetch all refs so setuptools_scm can generate the correct version number
          persist-credentials: false

      # Compute the version against the pristine checkout before any tree mutation, and
      # export it as the toga-winforms-scoped pretend version. This ensures that later
      # modifications don't cause a `.devN+...` version.
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.X"

      - name: Pin setuptools_scm version
        run: |
          python -m pip install --group setuptools_scm
          SCM_VERSION="$(python -m setuptools_scm --root . -c winforms/pyproject.toml)"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${SCM_VERSION}" >> "$GITHUB_ENV"

      # A tagged wheel is generated by writing a `bdist_wheel` section to pyproject.toml
      - name: Configure platform tag
        run: |
          printf '[tool.distutils.bdist_wheel]\nplat-name = "${{ matrix.plat-name }}"\n' >> pyproject.toml

      # To ensure the binary wheel only contains the binaries for that platform,
      # delete content that is for other architectures.
      - name: Remove x86 binary
        if: ${{ matrix.arch != 'x86' }}
        run: |
          rm -rf src/WebView2/runtimes/win-x86

      - name: Remove x86_64 binary
        if: ${{ matrix.arch != 'x86_64' }}
        run: |
          rm -rf src/WebView2/runtimes/win-x64

      - name: Remove ARM64 binary
        if: ${{ matrix.arch != 'arm64' }}
        run: |
          rm -rf src/WebView2/runtimes/win-arm64

      - name: Build Package & Upload Artifact
        id: package
        uses: hynek/build-and-inspect-python-package@d44ca7d91762de7a7d5436ddae667c6da6d1c3df  # v2.18.0
        with:
          upload-name-suffix: ${{ format('-{0}', matrix.arch) }}
          attest-build-provenance-github: ${{ inputs.attest-package }}
          skip-wheel: false
          skip-sdist: true

  test:
    name: Test (${{ matrix.runs-on }}, Python ${{ matrix.python-version}})
    needs: package
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on: ["windows-latest", "windows-11-arm"]
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: ${{ github.repository }}
          fetch-depth: 0  # Fetch all refs so setuptools_scm can generate the correct version number
          persist-credentials: false

      - name: Get packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "Packages-*"
          merge-multiple: true
          path: dist

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install -U pip
          python -m pip install --pre -f ./dist WebView2.runtime

      - name: Test package
        run: |
          python tools/smoke_test.py
