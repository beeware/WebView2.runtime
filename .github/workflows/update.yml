name: Update WebView2 Runtime

on:
  # Run at 8PM (20:00) UTC every Sunday.
  schedule:
    - cron: "0 20 * * 0"
  # Allow the workflow to be triggered manually.
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  update:
    name: Check for WebView2 update
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ github.repository }}
          fetch-depth: 0  # Fetch all refs so update.py can compare against release tags
          persist-credentials: false
          # Use the brutusthebee PAT so that the pushed branch triggers CI on the PR.
          token: ${{ secrets.BRUTUS_PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.X"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install --group update --group pre-commit

      - name: Run update script
        id: update
        run: |
          python tools/update.py | tee update.log

          # If update.py didn't modify any vendored files, there's nothing to do.
          if [ -z "$(git status --porcelain)" ]; then
            echo "No update available; nothing to do."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract the version the script updated to from its output.
          VERSION="$(sed -n 's/^Updated WebView2 DLLs to \(.*\)\.$/\1/p' update.log)"
          echo "Update found for version ${VERSION}."
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Apply pre-commit fixes
        if: steps.update.outputs.updated == 'true'
        run: |
          # The LICENSE.WebView2 file (and potentially other files) will be
          # rewritten by the pre-commit hooks (e.g. end-of-file-fixer). Run
          # pre-commit so the committed content matches what CI expects. This
          # is expected to modify files, so the non-zero exit code is ignored.
          python -m pre_commit run --all-files || true

      - name: Create Pull Request
        if: steps.update.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e  # v7.0.8
        with:
          token: ${{ secrets.BRUTUS_PAT_TOKEN }}
          branch: update/webview2-${{ steps.update.outputs.version }}
          commit-message: "Update WebView2 runtime to ${{ steps.update.outputs.version }}"
          title: "Update WebView2 runtime to ${{ steps.update.outputs.version }}"
          body: |
            Update the Microsoft.Web.WebView2 runtime DLLs to version `${{ steps.update.outputs.version }}`.

          author: "Brutus[bot] <brutus@beeware.org>"
          committer: "Brutus[bot] <brutus@beeware.org>"
          delete-branch: true
