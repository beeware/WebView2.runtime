[build-system]
requires = [
    "setuptools==83.0.0",
    "setuptools_scm==10.2.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "WebView2.runtime"
dynamic = ["version"]
description = "A Python package providing the Microsoft.Web.WebView2 runtime DLLs"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE", "LICENSE.WebView2"]
authors = [
    {name = "Russell Keith-Magee", email = "russell@keith-magee.com"},
]
keywords = ["Microsoft", "WebView2"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "pythonnet >= 3.0.0",
]

[project.urls]
Homepage = "https://github.com/beeware/webview2-runtime"
Funding = "https://beeware.org/contributing/membership/"
Tracker = "https://github.com/beeware/webview2-runtime/issues"
Source = "https://github.com/beeware/webview2-runtime"

[dependency-groups]
# Extras used by developers *of* this library are pinned to specific versions to
# ensure environment consistency.
pre-commit = [
    "pre-commit == 4.6.0",
]

setuptools-scm = [
    "setuptools_scm == 10.2.0",
]

update = [
    "httpx2 == 2.9.0",
]

dev = [
    {include-group = "pre-commit"},
    {include-group = "setuptools-scm"},
    {include-group = "update"},
]

test = [
    {include-group = "setuptools-scm"},
]

[tool.ruff.lint]
# In addition to the default rules, these additional rules will be used:
extend-select = [
    "E",      # pycodestyle
    "W",      # pycodestyle
    "F",      # pyflakes
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "YTT",    # flake8-2020
    "ASYNC",  # flake8-async
    "C4",     # flake8-comprehensions
    "I",      # isort
    # The SIM rules are *very* opinionated, and don't necessarily make for better code.
    # They may be worth occasionally turning on just to see if something could actually
    # use improvement.
    # "SIM",    # flake8-simplify
]

[tool.rumdl]
flavor = "mkdocs"
include = ["**/*.md"]
exclude = [
    "comment.md",
    "CODE_OF_CONDUCT.md",
]
respect-gitignore = true

# Disable rules:
# MD014: Forces commands in codeblocks to show output
# MD033: No inline HTML
disable = [
    "MD014",
    "MD033",
]

[tool.rumdl.per-file-ignores]

[tool.rumdl.MD013]  # Line length
line_length = 999999
reflow = true
reflow_mode = "normalize"

[tool.rumdl.MD026]  # Remove punctuation at the end of headings
punctuation = ",;:"

[tool.rumdl.MD061]  # Fail on certain strings.
terms = ["TODO"]

[tool.setuptools_scm]
# To enable SCM versioning, we need an empty tool configuration for setuptools_scm
